<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b35;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f8ff7;
    --accent-dim: #24354f;
    --danger: #f76a6a;
    --ok: #4fd18b;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 57px);
  }
  nav {
    border-right: 1px solid var(--border);
    padding: 16px 12px;
  }
  nav button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 4px;
    background: transparent;
    border: none;
    border-radius: var(--radius);
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  nav button:hover {
    background: var(--panel);
    color: var(--text);
  }
  nav button.active {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 600;
  }
  main {
    padding: 32px;
  }
  .view { display: none; max-width: 480px; }
  .view.active { display: block; }
  .view h2 {
    margin-top: 0;
    font-size: 20px;
  }
  .view p.hint {
    color: var(--muted);
    font-size: 13px;
    margin-top: -4px;
  }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  input, select, textarea {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button.submit {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button.submit:hover { opacity: 0.9; }
  button.submit:focus-visible, nav button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #category-status, #transaction-status {
    margin-top: 12px;
    font-size: 13px;
    min-height: 18px;
  }
  .status-ok { color: var(--ok); }
  .status-error { color: var(--danger); }
  .todo {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
  }
  code {
    background: #0f1115;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    border: 1px solid var(--border);
    padding: 10px;
    text-align: left;
}

th {
    background: var(--panel);
}

tr:hover {
    background: rgba(255,255,255,0.03);
}
 /* --- Lista de transacciones agrupada por día --- */
  .tx-list {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 520px;
  }
  .tx-day-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .tx-day-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .tx-day-number {
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    min-width: 40px;
  }
  .tx-day-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }
  .tx-day-weekday {
    font-size: 13px;
    color: var(--muted);
  }
  .tx-day-date {
    font-size: 15px;
    font-weight: 600;
  }
  .tx-day-totals {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    font-weight: 600;
    font-size: 14px;
  }
  .tx-total-income { color: var(--ok); }
  .tx-total-expense { color: var(--danger); }
  .tx-day-chevron {
    color: var(--muted);
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .tx-day-card.open .tx-day-chevron {
    transform: rotate(180deg);
  }
  .tx-day-items {
    display: none;
    border-top: 1px solid var(--border);
  }
  .tx-day-card.open .tx-day-items {
    display: block;
  }
  .tx-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  .tx-item:first-child { border-top: none; }
  .tx-item-category { color: var(--text); }
  .tx-item-desc { color: var(--muted); font-size: 12px; }
  .tx-item-amount.INCOME { color: var(--ok); }
  .tx-item-amount.EXPENSE { color: var(--danger); }
  .tx-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 12px 0;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Finance Tracker</h1>
</header>

<div class="layout">
  <nav>
    <button class="nav-btn active" data-view="categories">Add Category</button>
    <button class="nav-btn" data-view="transactions">Add Transaction</button>
  </nav>

  <main>

    <!-- Vista: Add category -->
    <section class="view active" id="view-categories">
      <h2>Add Category</h2>
      <p class="hint">Create a new expense or income category.</p>

      <form id="category-form">
        <label>
          category name
          <input type="text" name="name" placeholder="food" required>
        </label>
        <label>
          Category description
          <input type="text" name="description" placeholder="food expenses">
        </label>
        <label>
          Type
          <select name="type" required>
            <option value="EXPENSE">EXPENSE</option>
            <option value="INCOME">INCOME</option>
          </select>
        </label>
        <button type="submit" class="submit">Save Category</button>
        <div id="category-status"></div>
      </form>
      <h3>Categories</h3>
      <table id ="category-table">
          <thead>
              <tr>
                  <th>name</th>
                  <th>description</th>
                  <th>type</th>               
              </tr>
          </thead>
          <tbody>
          </tbody>
      </table>
    </section>

    <!-- Vista: Registrar transacción -->
    <section class="view" id="view-transactions">
      <h2>Add transaction</h2>
      <p class="hint">Create a new income or expense transaction</p>
      <form id="transaction-form">
        
        <label>
          Category
          <select name="categoryId" id="category-select" required>
            <option value="" disabled selected>Loading categories...</option>
          </select>
        </label>

        <label>
          amount
          <input type="text" name="amount" placeholder="0" required>
        </label>

        <label>
          description
          <input type="text" name="description" placeholder="lunch">
        </label>

        <label>
          Date
          <input type="date" name="transaction-date" placeholder="30/08/2026"  required>
        </label>

        <label>
          currency
          <input type="text" name="currency" placeholder="COP" required>
        </label>

        <button type="submit" class="submit">Save Transaction</button>
        <div id="transaction-status"></div>
      </form>
      <h3>Transactions by Category</h3>
      <table id ="transactions-table">
        <thead>
            <tr>
                <th>CategoryName</th>
                <th>Type</th>
                <th>Total</th>
                <th>transaction Count</th>
            </tr>
        </thead>
        <tbody>
        </tbody>  
      </table>
      <h3>Transactions by Day</h3>
      <div id="tx-list" class="tx-list"></div>

      <label id = "income" name = "income"> Total Income:</label>
      <label id = "expenses" name = "expenses"> Total Expense:</label>
      <label id = "balance" name = "balance"> Total Balance:</label>
    </section>
  </main>
</div>

<script>
  const API_BASE = "http://localhost:8080";

  // --- Navegation between views/pages ---
  const navButtons = document.querySelectorAll(".nav-btn");
  const views = document.querySelectorAll(".view");

  navButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      navButtons.forEach(b => b.classList.remove("active"));
      views.forEach(v => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`view-${btn.dataset.view}`).classList.add("active");
    });
  });

  // --- Formulario: Registrar categoría ---
  const categoryForm = document.getElementById("category-form");
  const categoryStatus = document.getElementById("category-status");

  categoryForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(categoryForm);
    const payload = {
      name: formData.get("name"),
      description: formData.get("description"),
      type: formData.get("type"),
    };

    categoryStatus.textContent = "Guardando...";
    categoryStatus.className = "";

    try {
      const res = await fetch(`${API_BASE}/api/v1/categories`, {
        method: "POST",
        headers: {
          "Accept": "*/*",
          "Content-Type": "application/json",
        },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `HTTP ${res.status}`);
      }

      categoryStatus.textContent = "Categoría creada correctamente.";
      categoryStatus.className = "status-ok";
      categoryForm.reset();
    } catch (err) {
      categoryStatus.textContent = `Error al crear la categoría: ${err.message}`;
      categoryStatus.className = "status-error";
    }
  });

  // --- Cargar categorías en el select de transacciones ---
  const categorySelect = document.getElementById("category-select");

  async function loadCategories(){
    try{
        const res = await fetch(`${API_BASE}/api/v1/categories`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const categories = await res.json();

        categorySelect.innerHTML = "";

        if(categories.length === 0){
          categorySelect.innerHTML = `<option value="" disabled selected> There are no added categories</option>`;
          return;
        }

        categorySelect.innerHTML = `<option value="" disabled selected>Select a category</option>`;
        categories.forEach(cat =>{
          const option = document.createElement("option");
          option.value = cat.id;
          option.textContent = cat.name;
          categorySelect.appendChild(option);
        });
      }catch(err){
        categorySelect.innerHTML = `<option value="" disabled selected> Error on loading categories</option>`;
      }
    }
    //Recarga las categorías cada vez que se entra a la vista de transacciones,
    //para reflejar las categorías creadas recientemente.
    document.querySelector('[data-view="transactions"]').addEventListener("click",loadCategories);
    //--- Formulario: Registrar transacción ---
    const transactionForm = document.getElementById("transaction-form");
    const transactionStatus = document.getElementById("transaction-status");
    const transactionsTableBody = document.querySelector("#transactions-table tbody");
    const categoriesTableBody = document.querySelector("#category-table tbody");

    transactionForm.addEventListener("submit",async (e)=>{
      e.preventDefault();
      const formData = new FormData(transactionForm);

      const payload = {
        categoryId: formData.get("categoryId"),
        amount: formData.get("amount"),
        currency:formData.get("currency"),
        description:formData.get("description"),
        transactionDate:formData.get("transaction-date"),
      };

      transactionStatus.textContent = "Saving...";
      transactionStatus.className = "";

      try{
        const res = await fetch(`${API_BASE}/api/v1/transactions`,{
          method: "POST",
          headers: {
            "Accept":"*/*",
            "Content-Type":"application/json",
          },
          body: JSON.stringify(payload),
        });

        if(!res.ok){
          const text = await res.text();
          throw new Error(text || `HTTP ${res.status}`);
        }

        transactionStatus.textContent = "Transaction created correctly";
        transactionStatus.className = "status-ok";
        transactionForm.reset();
        
        loadTransactions();
      }catch(err){
        transactionStatus.textContent = `Error creating transaction: ${err.message}`;
        transactionStatus.className = "status-error";
      }
    });

    async function loadCategoriesTable(){
        try{
            const res = await fetch(`${API_BASE}/api/v1/categories`);

            if(!res.ok){
              throw new Error(`HTTP ${res.status}`);
            }

            const data = await res.json();

            console.log(data);

            categoriesTableBody.innerHTML = "";

            data.forEach(category =>{
              const row = document.createElement("tr");

              row.innerHTML =`
                <td>${category.name}</td>
                <td>${category.description}</td>
                <td>${category.type}</td>
              `;
              categoriesTableBody.appendChild(row);
            });

        }catch(err){
          console.error("Error loading categories table", err);
        }
    }

    const income = document.getElementById("income");
    const expenses = document.getElementById("expenses");
    const balance = document.getElementById("balance");

    async function loadTransactions(){
      try{
          const res = await fetch(`${API_BASE}/api/v1/transactions/summary/year?year=2026`);

          if(!res.ok){
            throw new Error(`HTTP ${res.status}`);
          }

          const data = await res.json();
          
          console.log(data);
          console.log(Array.isArray(data));
          console.log(Array.isArray(data.byCategory));
          
          transactionsTableBody.innerHTML = "";
          data.byCategory.forEach(transaction => {
              const row = document.createElement("tr");
          
              row.innerHTML =`
                  <td>${transaction.categoryName}</td>
                  <td>${transaction.type}</td>
                  <td>${transaction.total}</td>
                  <td>${transaction.transactionCount}</td>
              `;

              transactionsTableBody.appendChild(row);
          });

          income.innerHTML = `Total Income = ${data.totalIncome}`;
          expenses.innerHTML = `Total Expense = ${data.totalExpense}`;
          balance.innerHTML = `Total Balance = ${data.balance}`;

      }catch(err){
        console.error("Error loading transactions table", err);
      }
    }
    loadCategoriesTable();
    loadTransactions();
</script>

</body>
</html>
